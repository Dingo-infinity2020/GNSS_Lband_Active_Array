<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="-170 -170 340 400">
  <rect x="-170" y="-170" width="340" height="400" fill="#ffffff"/>
  <text x="-160" y="-150" font-family="monospace" font-size="9">R0 CENTER/FEED INTERPRETATION — project-owned redraw (no source imagery)</text>
  <text x="-160" y="-138" font-family="monospace" font-size="7">12-slot V0.3 topology, frozen; centre/feed region unresolved; candidates shown below, no winner selected</text>

  <!-- main board -->
  <g transform="translate(0,-5)">
    <rect x="-123.75" y="-123.75" width="247.5" height="247.5" fill="#f2f2f2" stroke="#222" stroke-width="0.8"/>
    <g fill="#8a6a4a">
      <!-- outer N -->
      <rect x="-103.125" y="-116.25" width="94.125" height="5"/>
      <rect x="9" y="-116.25" width="94.125" height="5"/>
      <!-- outer S -->
      <rect x="-103.125" y="111.25" width="94.125" height="5"/>
      <rect x="9" y="111.25" width="94.125" height="5"/>
      <!-- outer W -->
      <rect x="-116.25" y="-103.125" width="5" height="94.125"/>
      <rect x="-116.25" y="9" width="5" height="94.125"/>
      <!-- outer E -->
      <rect x="111.25" y="-103.125" width="5" height="94.125"/>
      <rect x="111.25" y="9" width="5" height="94.125"/>
      <!-- inner -->
      <rect x="-4.5" y="-103" width="9" height="73"/>
      <rect x="-4.5" y="30" width="9" height="73"/>
      <rect x="-103" y="-4.5" width="73" height="9"/>
      <rect x="30" y="-4.5" width="73" height="9"/>
    </g>
    <!-- visible central clear span estimate -->
    <rect x="-30" y="-30" width="60" height="60" fill="none" stroke="#1976d2" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="34" y="0" font-family="monospace" font-size="5" fill="#1976d2">~60 mm visible clear span (photo estimate)</text>
    <text x="-118" y="140" font-family="monospace" font-size="5" fill="#444">centre/feed region hidden by electronics/local ground in the fabricated unit</text>
  </g>

  <!-- candidate A -->
  <g transform="translate(-108,175)">
    <rect x="-45" y="-45" width="90" height="90" fill="#fafafa" stroke="#999" stroke-width="0.4"/>
    <text x="-45" y="-50" font-family="monospace" font-size="6">A: feed-terminal gap</text>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#c62828" stroke-width="1.5"/>
    <circle cx="-20" cy="0" r="2.2" fill="#c62828"/>
    <circle cx="20" cy="0" r="2.2" fill="#c62828"/>
    <text x="-8" y="-4" font-family="monospace" font-size="5" fill="#c62828">40 mm</text>
    <text x="-42" y="12" font-family="monospace" font-size="4.5" fill="#555">differential terminals,</text>
    <text x="-42" y="18" font-family="monospace" font-size="4.5" fill="#555">gap = 40 mm?</text>
  </g>

  <!-- candidate B -->
  <g transform="translate(0,175)">
    <rect x="-45" y="-45" width="90" height="90" fill="#fafafa" stroke="#999" stroke-width="0.4"/>
    <text x="-45" y="-50" font-family="monospace" font-size="6">B: small central cutout</text>
    <rect x="-20" y="-20" width="40" height="40" fill="#e0e0e0" stroke="#c62828" stroke-width="1"/>
    <text x="-8" y="-24" font-family="monospace" font-size="5" fill="#c62828">40 mm</text>
    <text x="-42" y="30" font-family="monospace" font-size="4.5" fill="#555">removed square for</text>
    <text x="-42" y="36" font-family="monospace" font-size="4.5" fill="#555">feed/electronics?</text>
  </g>

  <!-- candidate C -->
  <g transform="translate(108,175)">
    <rect x="-45" y="-45" width="90" height="90" fill="#fafafa" stroke="#999" stroke-width="0.4"/>
    <text x="-45" y="-50" font-family="monospace" font-size="6">C: local feed ground</text>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#c62828" stroke-width="1"/>
    <line x1="-20" y1="26" x2="20" y2="26" stroke="#c62828" stroke-width="0.8"/>
    <text x="-8" y="23" font-family="monospace" font-size="5" fill="#c62828">40 mm</text>
    <text x="-42" y="34" font-family="monospace" font-size="4.5" fill="#555">ground beneath</text>
    <text x="-42" y="40" font-family="monospace" font-size="4.5" fill="#555">feed points?</text>
  </g>

  <text x="-160" y="222" font-family="monospace" font-size="5.5" fill="#333">Candidate D (not drawn): inner-region spacing other than the ~60 mm visible clear span.</text>
  <text x="-160" y="230" font-family="monospace" font-size="5.5" fill="#333">Fig.1 40 mm label endpoints are not unambiguous in the available record; SEMANTICS_UNRESOLVED.</text>
  <text x="-160" y="238" font-family="monospace" font-size="5.5" fill="#333">Redrawn from project interpretation only; contains no source photograph or copyrighted figure.</text>
</svg>
